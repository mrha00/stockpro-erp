name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore InventorySystem/InventorySystem.slnx

      - name: Build
        run: dotnet build InventorySystem/InventorySystem.slnx --no-restore

      - name: Test
        run: dotnet test InventorySystem/InventorySystem.slnx --no-restore --verbosity normal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: stockpro-erp/package-lock.json

      - name: Frontend typecheck
        working-directory: stockpro-erp
        run: |
          npm ci
          npm run lint
